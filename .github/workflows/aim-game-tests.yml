name: AIM Forge Tests

on:
  push:
    paths:
      - '09-aim-game/**'
      - '.github/workflows/aim-game-tests.yml'
  pull_request:
    paths:
      - '09-aim-game/**'
      - '.github/workflows/aim-game-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 09-aim-game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Jest test suite
        run: npm test
